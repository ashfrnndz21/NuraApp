name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - run: make test
      - run: make lint
      - run: make plain-words
      - run: make language
  backend-postgres:
    # The whole suite and the migrations on Postgres, the database every deployment runs on
    # (docs/deploy.md). A candidate for a required check. The laptop never needs a Postgres:
    # this job is the only place one runs. tests/conftest.py gives each test its own schema
    # on this server through NURA_TEST_DATABASE_URL, and drops it after.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # An ephemeral container that lives for this job; nothing real is behind it.
          POSTGRES_USER: nura
          POSTGRES_PASSWORD: nura-ci-only
          POSTGRES_DB: nura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nura -d nura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NURA_REGION: SG
      NURA_DATABASE_URL: postgresql+asyncpg://nura:nura-ci-only@localhost:5432/nura
      NURA_TEST_DATABASE_URL: postgresql+asyncpg://nura:nura-ci-only@localhost:5432/nura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - name: Migrations up, down to nothing, and up again (alembic, on an empty Postgres)
        working-directory: backend
        run: |
          python -m alembic upgrade heads
          python -m alembic downgrade base
          python -m alembic upgrade heads
          python -m alembic current
      - name: The migrated schema is the one the models declare (alembic check, on Postgres)
        # #131's test runs the same check on SQLite; Postgres keeps types SQLite does not (uuid,
        # timestamptz, json, varchar lengths), so drift that SQLite cannot see shows here.
        working-directory: backend
        run: python -m alembic check
      - name: The whole suite on Postgres
        working-directory: backend
        run: python -m pytest -q -rfE
  image:
    # The production image (Dockerfile) builds — never pushed — so it cannot rot. Then, on an
    # empty Postgres: the release step migrates it; a demo (NURA_DEMO_MODE=1) serves the API
    # and the web client as a non-root user; and without demo mode the same image refuses to
    # start on the fixtures.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nura
          POSTGRES_PASSWORD: nura-ci-only
          POSTGRES_DB: nura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nura -d nura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The platform's form of the URL; the app gives it the asyncpg driver itself.
      DB: postgres://nura:nura-ci-only@localhost:5432/nura
      FIXTURES: >-
        -e NURA_PAPER_FIXTURES=tests/fixtures/paper -e NURA_VISIT_FIXTURES=tests/fixtures/visits
        -e NURA_VOICE_FIXTURES=tests/fixtures/voice -e NURA_FEED_FIXTURES=tests/fixtures/feed
        -e NURA_WHATSAPP_FIXTURES=tests/fixtures/whatsapp -e NURA_OBJECT_STORE=/tmp/nura-objects
        -e NURA_SPEAKER_FIXTURES=tests/fixtures/speakers
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t nura:ci .
      - name: The release step migrates an empty Postgres
        run: docker run --rm --network host -e NURA_REGION=SG -e NURA_DATABASE_URL="$DB" nura:ci alembic upgrade heads
      - name: A demo serves the API and the web client, not as root
        run: |
          docker run -d --name nura --network host -e NURA_REGION=SG -e NURA_DATABASE_URL="$DB" \
            -e NURA_DEMO_MODE=1 -e NURA_DEMO_LOGIN_CODE=246810 -e NURA_WHATSAPP_DEV_SECRET=ci-only \
            $FIXTURES nura:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health/ready && break; sleep 1; done
          curl -fsS localhost:8000/health/ready | grep -q '"ok"'
          curl -fsS localhost:8000/api/deployment | grep -q '"demo":true'
          curl -fsS localhost:8000/app/ | grep -q 'id="app"'
          test "$(docker exec nura id -u)" != "0"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/auth/phone/start \
            -H 'content-type: application/json' -d '{"phone_e164": "+6591234567"}')
          test "$code" = "403"
      - name: Without demo mode, the image refuses to start on the fixtures
        run: |
          set +e
          out=$(timeout 60 docker run --rm --network host -e NURA_REGION=SG -e NURA_DATABASE_URL="$DB" \
            -e NURA_WHATSAPP_DEV_SECRET=ci-only $FIXTURES nura:ci 2>&1)
          status=$?
          set -e
          echo "$out" | tail -5
          test "$status" -ne 0 && test "$status" -ne 124
          echo "$out" | grep -q NoCodeSender
      - name: Every provider a demo runs on is a fixture production refuses, by name
        # A start without demo mode stops at the first refusal (the code sender), so this builds
        # the very providers the demo above deployed, inside the image, and puts them to the
        # central check (app.fixtures) with production settings: each must be named.
        run: |
          docker run --rm -i --network host -e NURA_REGION=SG -e NURA_DATABASE_URL="$DB" \
            -e NURA_DEMO_MODE=1 -e NURA_DEMO_LOGIN_CODE=246810 -e NURA_WHATSAPP_DEV_SECRET=ci-only \
            $FIXTURES nura:ci python - <<'PY'
          from app.fixtures import FixtureOutsideDevOrDemo, check_fixtures, fixtures_in
          from app.identity.providers import DemoSenderOutsideDemo, check_sender
          from app.main import providers_for, settings as demo
          from app.settings import load_settings

          providers = providers_for(demo)
          production = load_settings({"NURA_REGION": "SG", "NURA_DATABASE_URL": "postgresql+asyncpg://u:p@h/db"})
          try:
              check_fixtures(production, providers)
          except FixtureOutsideDevOrDemo as refused:
              named = str(refused)
          else:
              raise SystemExit("production accepted the demo's fixtures")
          expected = {"object_store", "extractor", "summariser", "transcriber", "searcher",
                      "compressor", "drug_registry", "whatsapp", "reference_ranges", "voice",
                      "push", "speaker_separator"}
          missing = sorted(name for name in expected if name not in named)
          assert not missing, f"not refused by name: {missing}"
          # The demo's code sender is not a fixture: it is refused outside a demo on its own.
          try:
              check_sender(production, providers.code_sender)
          except DemoSenderOutsideDemo:
              pass
          else:
              raise SystemExit("production accepted the demo's code sender")
          print("refused by name:", ", ".join(fixtures_in(providers)), "+ the demo code sender")
          PY
      - name: With VAPID keys, a deployment pushes by Web Push, a real sender production accepts
        # Throwaway keys made inside the job and never kept: with the three NURA_VAPID_*
        # settings the demo's push is WebPush, not a fixture, and production's check no longer
        # names push among the fixtures it refuses. Without them (the steps above) it does.
        run: |
          docker run --rm -i --network host -e NURA_REGION=SG -e NURA_DATABASE_URL="$DB" \
            -e NURA_DEMO_MODE=1 -e NURA_DEMO_LOGIN_CODE=246810 -e NURA_WHATSAPP_DEV_SECRET=ci-only \
            $FIXTURES nura:ci python - <<'PY'
          import base64, os
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          from app.delivery.push import WebPush, push_sender_for
          from app.fixtures import fixtures_in, is_fixture
          from app.main import providers_for
          from app.settings import load_settings

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          key = ec.generate_private_key(ec.SECP256R1())
          vapid = {
              "NURA_VAPID_PUBLIC_KEY": b64(key.public_key().public_bytes(Encoding.X962, PublicFormat.UncompressedPoint)),
              "NURA_VAPID_PRIVATE_KEY": b64(key.private_numbers().private_value.to_bytes(32, "big")),
              "NURA_VAPID_SUBJECT": "mailto:ci@nura.invalid",
          }
          providers = providers_for(load_settings({**os.environ, **vapid}))
          assert isinstance(providers.push, WebPush) and not is_fixture(providers.push), type(providers.push)
          assert "push" not in fixtures_in(providers), fixtures_in(providers)
          production = load_settings({"NURA_REGION": "SG", "NURA_DATABASE_URL": "postgresql+asyncpg://u:p@h/db", **vapid})
          assert isinstance(push_sender_for(production), WebPush)
          print("with VAPID keys: push is", providers.push.name, "- not a fixture; still refused:", ", ".join(fixtures_in(providers)))
          PY
      - if: failure()
        run: docker logs nura || true
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd web && npm ci
      - run: cd web && npm test
      - run: cd web && npm run build
      - run: cd web && npm run plain-words
      - run: pip install -e "backend[dev]"
      - run: cd web && npx playwright install --with-deps chromium
      # Playwright starts the backend itself (web/playwright.config.ts `webServer`): `make dev`
      # serving the build just made, its clock frozen at 10:00 in Singapore (NURA_FROZEN_CLOCK).
      - run: cd web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, if-no-files-found: ignore }
  ios:
    # macOS runners are billed at 10x minutes and exhausted the private-repo free tier in a
    # day while ios/ holds one smoke test. Off until Session 10 generates a real app; flip the
    # variable NURA_IOS_CI=1 in repo settings to turn it back on.
    if: vars.NURA_IOS_CI == '1' && (contains(github.event.pull_request.changed_files, 'ios/') || github.event_name == 'push')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: make ios-test
      - name: Screenshot for review
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl io booted screenshot ios/build/screenshot.png || true
      - uses: actions/upload-artifact@v4
        with: { name: ios-screenshot, path: ios/build/screenshot.png, if-no-files-found: ignore }
  automerge:
    needs: [backend, backend-postgres, image, web]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'risk:low')
    runs-on: ubuntu-latest
    # Auto-merge is not available on this private repository's plan; the operator merges
    # risk:low PRs by hand. Keep the step so it starts working if the plan changes, but
    # never let it redden CI.
    continue-on-error: true
    permissions: { contents: write, pull-requests: write }
    steps:
      - run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
