name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - run: make test
      - run: make lint
      - run: make plain-words
  backend-postgres:
    # The whole suite and the migrations on Postgres, the database every deployment runs on
    # (docs/deploy.md). A candidate for a required check. The laptop never needs a Postgres:
    # this job is the only place one runs. tests/conftest.py gives each test its own schema
    # on this server through NURA_TEST_DATABASE_URL, and drops it after.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # An ephemeral container that lives for this job; nothing real is behind it.
          POSTGRES_USER: nura
          POSTGRES_PASSWORD: nura-ci-only
          POSTGRES_DB: nura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nura -d nura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NURA_REGION: SG
      NURA_DATABASE_URL: postgresql+asyncpg://nura:nura-ci-only@localhost:5432/nura
      NURA_TEST_DATABASE_URL: postgresql+asyncpg://nura:nura-ci-only@localhost:5432/nura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - name: Migrations up, down to nothing, and up again (alembic, on an empty Postgres)
        working-directory: backend
        run: |
          python -m alembic upgrade heads
          python -m alembic downgrade base
          python -m alembic upgrade heads
          python -m alembic current
      - name: The whole suite on Postgres
        working-directory: backend
        run: python -m pytest -q -rfE
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd web && npm ci
      - run: cd web && npm test
      - run: cd web && npm run build
      - run: cd web && npm run plain-words
      - run: pip install -e "backend[dev]"
      - run: cd web && npx playwright install --with-deps chromium
      # Playwright starts the backend itself (web/playwright.config.ts `webServer`): `make dev`
      # serving the build just made, its clock frozen at 10:00 in Singapore (NURA_FROZEN_CLOCK).
      - run: cd web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, if-no-files-found: ignore }
  ios:
    # macOS runners are billed at 10x minutes and exhausted the private-repo free tier in a
    # day while ios/ holds one smoke test. Off until Session 10 generates a real app; flip the
    # variable NURA_IOS_CI=1 in repo settings to turn it back on.
    if: vars.NURA_IOS_CI == '1' && (contains(github.event.pull_request.changed_files, 'ios/') || github.event_name == 'push')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: make ios-test
      - name: Screenshot for review
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl io booted screenshot ios/build/screenshot.png || true
      - uses: actions/upload-artifact@v4
        with: { name: ios-screenshot, path: ios/build/screenshot.png, if-no-files-found: ignore }
  automerge:
    needs: [backend, backend-postgres, web]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'risk:low')
    runs-on: ubuntu-latest
    # Auto-merge is not available on this private repository's plan; the operator merges
    # risk:low PRs by hand. Keep the step so it starts working if the plan changes, but
    # never let it redden CI.
    continue-on-error: true
    permissions: { contents: write, pull-requests: write }
    steps:
      - run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
