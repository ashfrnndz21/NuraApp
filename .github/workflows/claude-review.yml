name: Review agent
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  # A review after the fact, for a PR merged while the reviewer was down (2026-09-15).
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review (open or merged)"
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Safety and plain-words review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number || inputs.pr }} for Nura (`gh pr diff ${{ github.event.pull_request.number || inputs.pr }}`). Run the clinical-safety-reviewer subagent on the diff, and the plain-words-reviewer on every patient-facing string that changed.
            Post one review with `gh pr review ${{ github.event.pull_request.number || inputs.pr }}` containing both reports: each check as pass or fail with file and line, and the rewritten lines for any string that failed.
            If any safety check fails, use `--request-changes`; otherwise `--comment`. If the PR touches backend/app/keys, consent, audit, medicines, reasoning, safety, WhatsApp outbound or a migration, add the label risk:high with `gh pr edit` if it is missing.
            If the pull request is already merged (`gh pr view N --json state`), a review cannot request changes on it: post the same report with `gh pr comment` instead, and if any check fails also open one issue titled "Retro review of #N" with the label risk:high, listing every FAIL with file and line and the rewritten lines. Read the code as it is now on the default branch where the diff has since changed.
            This is a headless run: it ends the moment you stop. Run the two reviewer subagents in the foreground and wait for their reports — never in the background — and do not finish until `gh pr review` has posted. If a subagent is unavailable, apply its checklist from .claude/agents/ yourself and say so in the review.
          claude_args: "--max-turns 100 --allowedTools Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(make:*),Bash(pytest:*)"
      - name: Confirm a review was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=${{ github.event.pull_request.number || inputs.pr }}
          reviews=$(gh api repos/$GH_REPO/pulls/$N/reviews -q 'map(select(.user.login=="github-actions[bot]")) | length')
          comments=$(gh api repos/$GH_REPO/issues/$N/comments -q 'map(select(.user.login=="github-actions[bot]")) | length')
          if [ "$reviews" = "0" ] && [ "$comments" = "0" ]; then
            echo "::error::The reviewer finished without posting a review on #$N."; exit 1
          fi
