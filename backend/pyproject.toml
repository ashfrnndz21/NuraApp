[project]
name = "nura-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy[asyncio]>=2", "alembic", "pydantic>=2", "asyncpg", "httpx"]
[project.optional-dependencies]
# aiosqlite is tests only: it is how the regional stores run in memory, one database per region.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "httpx", "aiosqlite"]
[tool.setuptools]
# The migrations directory is not a package; only `app` is installed.
packages = ["app"]
[tool.ruff]
line-length = 100
[tool.ruff.lint.isort]
known-third-party = ["alembic"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
