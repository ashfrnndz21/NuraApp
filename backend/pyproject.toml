[project]
name = "nura-backend"
version = "0.1.0"
requires-python = ">=3.12"
# FastAPI, Starlette and SQLAlchemy are pinned exactly: a newer FastAPI stores included routers
# differently and CI resolved one the laptops did not (PR #120). Bump them together, on purpose.
dependencies = [
    "fastapi==0.116.1",
    "starlette==0.47.2",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy[asyncio]==2.0.43",
    "alembic",
    "pydantic>=2",
    "asyncpg",
    "httpx",
    # The claude searcher/compressor adapters (NURA_SEARCHER/NURA_COMPRESSOR=claude): the
    # official SDK, used only from app.delivery.feed.claude_adapters and only on a declared
    # demo (ANTHROPIC_API_KEY, NURA_DEMO_MODE=1).
    "anthropic",
    # Web Push (ADR 0001): Mozilla's own RFC 8291 payload encryption and RFC 8292 VAPID
    # signing, the two libraries pywebpush wraps; sent with httpx, so no requests.
    "cryptography==50.0.1",
    "http-ece==1.2.1",
    "py-vapid==1.9.4",
    # The Claude-backed extractor (NURA_EXTRACTOR=claude, demo only — ADR 0017).
    "anthropic==1.6.0",
]
[project.optional-dependencies]
# aiosqlite is tests only: it is how the regional stores run in memory, one database per region.
dev = ["pytest", "pytest-asyncio", "ruff==0.16.7", "mypy", "httpx", "aiosqlite"]
[tool.setuptools]
# The migrations directory is not a package; only `app` is installed.
packages = ["app"]
[tool.ruff]
line-length = 100
[tool.ruff.lint.isort]
known-third-party = ["alembic"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
