# Nura on Fly.io — one app for Singapore (docs/deploy.md). A second country is a second app
# with its own database and bucket; nothing is shared across. Secrets are set with
# `fly secrets set`, never written here: NURA_DATABASE_URL, NURA_DEMO_LOGIN_CODE,
# NURA_WHATSAPP_DEV_SECRET, and the bucket's NURA_OBJECT_BUCKET_URL, NURA_OBJECT_ACCESS_KEY_ID
# and NURA_OBJECT_SECRET_ACCESS_KEY. No volume: bytes go to the bucket, rows to Postgres.

app = "nura-sg"            # the name you gave `fly apps create`
primary_region = "sin"     # Singapore

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a one-off machine from the new image, with the app's secrets, before any machine
  # takes traffic; a failed migration stops the deploy.
  release_command = "alembic upgrade heads"
  strategy = "rolling"

[env]
  NURA_REGION = "SG"
  PORT = "8000"
  # A demo (ADR 0008): the fixtures are the only providers built yet. Remove this line only
  # when every real provider is configured; the process refuses to start on a fixture without it.
  NURA_DEMO_MODE = "1"
  NURA_PAPER_FIXTURES = "tests/fixtures/paper"
  NURA_VISIT_FIXTURES = "tests/fixtures/visits"
  NURA_VOICE_FIXTURES = "tests/fixtures/voice"
  NURA_FEED_FIXTURES = "tests/fixtures/feed"
  NURA_WHATSAPP_FIXTURES = "tests/fixtures/whatsapp"
  NURA_SPEAKER_FIXTURES = "tests/fixtures/speakers"
  # Tigris signs as `auto`; an AWS bucket in Singapore says `ap-southeast-1`. Either way the
  # bucket keeps its bytes in Singapore: a Tigris bucket is Global unless it is created
  # single-region in `sin` (docs/deploy.md, Fly step 3).
  NURA_OBJECT_BUCKET_REGION = "auto"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays up: the demo's night wipe runs in it (app/demo.py).
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    # Up, and the database answers. A new version that fails this does not take traffic.
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
