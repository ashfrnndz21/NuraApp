<!doctype html>
<html lang="en" data-density="patient" data-posture="stable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nura</title>
    <meta name="description" content="Nura keeps your papers, your medicines and your blood pressure book." />
    <meta name="theme-color" content="#1F1731" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nura" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- The phone frame (docs/design/experience-blueprint.html `.phone`, owner's scope change
         2026-09-21): above 600px wide, `.page-ground` is a plain dark page and `.phone-frame` is
         a real 390px device — bezel, radius, shadow — centred on it; below 600px (a real phone)
         `.phone-frame` is a full-bleed pass-through with no frame of its own (base.css). The
         atmosphere lives INSIDE the frame now, as its first child, so it is what the frame's own
         `overflow: hidden` clips rather than the browser viewport. Static markup, not a
         component: it only ever reads CSS custom properties already on <html> (tokens.css
         `--wash-*`), so it needs no script of its own. `.phone-frame` is also the containing
         block for every `position: fixed` element the app draws (a sheet, a toast, the tab bar's
         own sheet) — base.css gives it a `transform`, which is what makes that true — so nothing
         the app opens can ever land outside the frame on a wide screen. -->
    <div class="page-ground">
      <div class="phone-frame" id="phone-frame">
        <div class="atmosphere" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="app"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
